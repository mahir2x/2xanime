<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2X Anime Vault - Global Server</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Outfit', sans-serif; }
        
        body { background: radial-gradient(circle at top left, #12151c, #050505, #0a0f16); color: #c5c6c7; min-height: 100vh; display: flex; flex-direction: column; overflow-x: hidden; background-attachment: fixed; }

        #cursor-glow { position: fixed; width: 400px; height: 400px; border-radius: 50%; background: radial-gradient(circle, rgba(0, 255, 204, 0.15) 0%, rgba(0, 0, 0, 0) 60%); pointer-events: none; transform: translate(-50%, -50%); z-index: 9999; transition: width 0.2s, height 0.2s; mix-blend-mode: screen; top: -1000px; left: -1000px; }

        header { background: rgba(10, 15, 22, 0.6); padding: 15px 25px; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(0, 255, 204, 0.2); position: sticky; top: 0; z-index: 100; backdrop-filter: blur(15px); gap: 15px; }
        .logo { font-size: 28px; font-weight: 800; color: #fff; text-transform: uppercase; letter-spacing: 1px; }
        .logo span { color: #00ffcc; text-shadow: 0 0 15px rgba(0, 255, 204, 0.8); }
        
        .search-box { flex: 1; max-width: 450px; display: flex; align-items: center; background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 30px; padding: 8px 20px; transition: 0.4s; backdrop-filter: blur(10px); }
        .search-box:focus-within { border-color: #00ffcc; box-shadow: 0 0 20px rgba(0, 255, 204, 0.2); transform: scale(1.02); background: rgba(0, 255, 204, 0.05); }
        .search-box input { width: 100%; background: transparent; border: none; color: #fff; outline: none; padding: 5px 0; font-size: 15px; }
        .search-box input::placeholder { color: rgba(255, 255, 255, 0.4); }
        .search-box svg { width: 20px; fill: #00ffcc; margin-right: 12px; opacity: 0.8; }

        .header-right { display: flex; align-items: center; gap: 20px; }
        .stats { font-size: 14px; font-weight: 600; color: #fff; background: linear-gradient(45deg, #00ffcc, #0088ff); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        .admin-lock { cursor: pointer; background: rgba(255, 255, 255, 0.05); padding: 12px; border-radius: 50%; border: 1px solid rgba(255, 255, 255, 0.1); display: flex; align-items: center; justify-content: center; transition: 0.3s; backdrop-filter: blur(5px); }
        .admin-lock:hover, .admin-lock.unlocked { background: rgba(0, 255, 204, 0.1); border-color: #00ffcc; box-shadow: 0 0 20px rgba(0, 255, 204, 0.4); transform: rotate(10deg); }
        .admin-lock svg { width: 20px; fill: #00ffcc; }

        .tags-container { padding: 20px 25px; display: flex; gap: 12px; overflow-x: auto; white-space: nowrap; background: linear-gradient(to bottom, rgba(10, 15, 22, 0.4), transparent); scroll-behavior: smooth; }
        .tags-container::-webkit-scrollbar { display: none; }
        .tag-btn { background: rgba(255, 255, 255, 0.03); color: #a8a8a8; border: 1px solid rgba(255, 255, 255, 0.1); padding: 8px 22px; border-radius: 30px; font-size: 14px; font-weight: 600; cursor: pointer; transition: 0.3s; text-transform: capitalize; backdrop-filter: blur(5px); }
        .tag-btn:hover { background: rgba(255, 255, 255, 0.1); color: #fff; transform: translateY(-2px); }
        .tag-btn.active { background: #00ffcc; color: #000; box-shadow: 0 0 20px rgba(0, 255, 204, 0.5); border-color: #00ffcc; }

        .grid-container { padding: 10px 25px 40px; display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 30px; flex: 1; z-index: 10; }
        .anime-card { border-radius: 16px; overflow: hidden; position: relative; cursor: pointer; transition: 0.4s; aspect-ratio: 2/3; background: #12151c; border: 1px solid rgba(255,255,255,0.05); box-shadow: 0 10px 30px rgba(0,0,0,0.6); }
        .anime-card:hover { transform: translateY(-12px) scale(1.03); border-color: rgba(0, 255, 204, 0.5); box-shadow: 0 20px 40px rgba(0, 255, 204, 0.25), 0 0 20px rgba(0, 255, 204, 0.1) inset; }
        .anime-card:hover .anime-img { transform: scale(1.1); filter: brightness(1.1); }
        .anime-img { width: 100%; height: 100%; object-fit: cover; transition: 0.6s; }
        
        .card-overlay { position: absolute; bottom: 0; left: 0; width: 100%; height: 70%; background: linear-gradient(to top, rgba(5,5,5,1) 0%, rgba(5,5,5,0.8) 40%, transparent 100%); display: flex; flex-direction: column; justify-content: flex-end; padding: 20px; transition: 0.3s; }
        .anime-card:hover .card-overlay { background: linear-gradient(to top, rgba(0, 20, 15, 0.95) 0%, rgba(0,0,0,0.6) 50%, transparent 100%); }
        .anime-title { font-size: 18px; font-weight: 800; color: #fff; margin-bottom: 10px; line-height: 1.3; text-shadow: 0 2px 10px rgba(0,0,0,1); }
        .anime-tags { display: flex; flex-wrap: wrap; gap: 6px; }
        .card-tag { background: rgba(0, 255, 204, 0.1); color: #00ffcc; border: 1px solid rgba(0, 255, 204, 0.3); font-size: 11px; padding: 4px 10px; border-radius: 20px; text-transform: uppercase; font-weight: 800; backdrop-filter: blur(5px); }

        .delete-btn { position: absolute; top: 12px; right: 12px; background: rgba(255, 0, 85, 0.8); color: #fff; border: 1px solid rgba(255, 255, 255, 0.2); width: 36px; height: 36px; border-radius: 50%; font-size: 16px; cursor: pointer; display: none; justify-content: center; align-items: center; backdrop-filter: blur(10px); transition: 0.3s; z-index: 5; }
        .delete-btn:hover { background: #ff0055; transform: scale(1.15) rotate(90deg); box-shadow: 0 0 20px #ff0055; border-color: #ff0055; }
        .admin-mode .delete-btn { display: flex; }

        #add-btn { position: fixed; bottom: 40px; right: 40px; background: linear-gradient(135deg, #00ffcc, #0088ff); color: #000; width: 65px; height: 65px; border-radius: 50%; font-size: 32px; font-weight: bold; border: none; cursor: pointer; box-shadow: 0 10px 30px rgba(0,255,204,0.4); display: none; z-index: 1000; transition: 0.4s; align-items: center; justify-content: center; }
        #add-btn:hover { transform: scale(1.15) rotate(180deg); box-shadow: 0 15px 40px rgba(0,255,204,0.6); }
        .admin-mode #add-btn { display: flex; }

        #admin-modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.7); display: none; justify-content: center; align-items: center; z-index: 2000; padding: 20px; backdrop-filter: blur(15px); opacity: 0; transition: 0.3s; }
        #admin-modal.show { opacity: 1; display: flex; }
        .modal-content { background: rgba(15, 20, 30, 0.9); padding: 40px; border-radius: 24px; width: 100%; max-width: 450px; border: 1px solid rgba(0, 255, 204, 0.3); box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5), 0 0 40px rgba(0, 255, 204, 0.1) inset; transform: translateY(20px); transition: 0.3s; }
        #admin-modal.show .modal-content { transform: translateY(0); }
        .modal-content h2 { color: #fff; margin-bottom: 30px; text-align: center; font-weight: 800; font-size: 24px; }
        .modal-content h2 span { color: #00ffcc; }
        .input-group { margin-bottom: 20px; }
        .input-group label { display: block; font-size: 13px; margin-bottom: 8px; color: #00ffcc; text-transform: uppercase; font-weight: 800; }
        .input-group input { width: 100%; padding: 15px 20px; background: rgba(0, 0, 0, 0.5); border: 1px solid rgba(255, 255, 255, 0.1); color: #fff; border-radius: 12px; outline: none; font-size: 15px; transition: 0.3s; }
        .input-group input:focus { border-color: #00ffcc; box-shadow: 0 0 15px rgba(0,255,204,0.2); background: rgba(0, 255, 204, 0.05); }
        .modal-actions { display: flex; gap: 15px; margin-top: 35px; }
        .modal-btn { flex: 1; padding: 15px; border: none; border-radius: 12px; font-weight: 800; font-size: 15px; cursor: pointer; text-transform: uppercase; transition: 0.3s; }
        .save-btn { background: linear-gradient(135deg, #00ffcc, #00b3ff); color: #000; box-shadow: 0 5px 15px rgba(0, 255, 204, 0.3); }
        .save-btn:hover { transform: translateY(-3px); box-shadow: 0 10px 25px rgba(0, 255, 204, 0.5); filter: brightness(1.1); }
        .cancel-btn { background: rgba(255, 0, 85, 0.1); color: #ff0055; border: 1px solid rgba(255, 0, 85, 0.3); }
        .cancel-btn:hover { background: #ff0055; color: #fff; box-shadow: 0 10px 25px rgba(255, 0, 85, 0.4); transform: translateY(-3px); }
        .empty-msg { grid-column: 1/-1; text-align: center; color: rgba(255,255,255,0.5); padding: 80px 20px; font-size: 18px; }

        @media (max-width: 768px) {
            header { padding: 15px; gap: 12px; }
            .grid-container { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); padding: 10px 15px 30px; gap: 15px; }
            .logo { font-size: 22px; }
            .search-box { order: 3; max-width: 100%; padding: 6px 15px; }
            .anime-title { font-size: 15px; }
            #add-btn { bottom: 20px; right: 20px; width: 55px; height: 55px; font-size: 28px; }
            .modal-content { padding: 25px 20px; }
        }
    </style>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>

    <div id="cursor-glow"></div>

    <header>
        <div class="logo">2X <span>Vault</span></div>
        <div class="search-box">
            <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
            <input type="text" id="search-input" placeholder="Search your anime..." oninput="handleSearch()">
        </div>
        <div class="header-right">
            <div class="stats" id="total-stats">Total: 0</div>
            <div class="admin-lock" id="admin-icon" onclick="checkAdmin()" title="Admin Login">
                <svg id="lock-svg" viewBox="0 0 24 24"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/></svg>
            </div>
        </div>
    </header>

    <div class="tags-container" id="tags-bar"></div>
    <div class="grid-container" id="anime-grid"></div>

    <button id="add-btn" onclick="openModal()">+</button>

    <div id="admin-modal">
        <div class="modal-content">
            <h2>Add <span>Anime</span></h2>
            <div class="input-group">
                <label>Title</label>
                <input type="text" id="anime-name" placeholder="e.g. Solo Leveling" autocomplete="off">
            </div>
            <div class="input-group">
                <label>HD Image URL</label>
                <input type="text" id="anime-img" placeholder="Paste high quality image link" autocomplete="off">
            </div>
            <div class="input-group">
                <label>Tags (Comma separated)</label>
                <input type="text" id="anime-tags" placeholder="e.g. Rom-Com, Action, Dark" autocomplete="off">
            </div>
            <div class="modal-actions">
                <button class="modal-btn cancel-btn" onclick="closeModal()">Cancel</button>
                <button class="modal-btn save-btn" onclick="saveAnime()">Add to Vault</button>
            </div>
        </div>
    </div>

    <script>
        // ================================================================
        // EXACT CONFIG FROM YOUR SCREENSHOT
        // ================================================================
        const firebaseConfig = {
            apiKey: "AIzaSyDGYwvbygKeQ5DrHR1luMfdzpbHytPgRdoo",
            authDomain: "anime-hub-4b305.firebaseapp.com",
            databaseURL: "https://anime-hub-4b305-default-rtdb.firebaseio.com",
            projectId: "anime-hub-4b305",
            storageBucket: "anime-hub-4b305.firebasestorage.app",
            messagingSenderId: "194191383047",
            appId: "1:194191383047:web:1b346bbfad7ea2188268a2",
            measurementId: "G-L8D5LL02SS"
        };
        // ================================================================

        // Initialize Firebase
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.database();

        let animeList = [];
        let currentFilter = "All";
        let searchQuery = "";
        let isAdmin = sessionStorage.getItem("2x_admin") === "true";

        // --- AUTO SYNC OLD LOCAL DATA TO FIREBASE ---
        db.ref('animes').once('value', (snapshot) => {
            if (!snapshot.exists()) {
                let localAnimes = JSON.parse(localStorage.getItem("2x_anime_vault"));
                if (localAnimes && localAnimes.length > 0) {
                    localAnimes.forEach(anime => {
                        db.ref('animes').push({
                            name: anime.name,
                            img: anime.img,
                            tags: anime.tags
                        });
                    });
                    console.log("Old animes automatically synced to Firebase!");
                }
            }
        });

        // --- REAL-TIME DATABASE LISTENER ---
        db.ref('animes').on('value', (snapshot) => {
            animeList = [];
            snapshot.forEach((childSnapshot) => {
                let data = childSnapshot.val();
                data.id = childSnapshot.key; // Unique Firebase ID
                animeList.push(data);
            });
            animeList.reverse(); // Show newest first
            renderApp();
        });

        function init() {
            if(isAdmin) enableAdminMode();
        }

        function renderApp() {
            renderTags();
            renderGrid();
            document.getElementById("total-stats").innerText = `Total: ${animeList.length}`;
        }

        function renderTags() {
            const tagsBar = document.getElementById("tags-bar");
            tagsBar.innerHTML = '';

            let allTags = new Set();
            animeList.forEach(anime => anime.tags.forEach(tag => allTags.add(tag.trim())));

            const allBtn = document.createElement("button");
            allBtn.className = `tag-btn ${currentFilter === "All" ? "active" : ""}`;
            allBtn.innerText = "All";
            allBtn.onclick = () => { currentFilter = "All"; renderApp(); };
            tagsBar.appendChild(allBtn);

            Array.from(allTags).sort().forEach(tag => {
                const btn = document.createElement("button");
                btn.className = `tag-btn ${currentFilter === tag ? "active" : ""}`;
                btn.innerText = tag;
                btn.onclick = () => { currentFilter = tag; renderApp(); };
                tagsBar.appendChild(btn);
            });
        }

        function renderGrid() {
            const grid = document.getElementById("anime-grid");
            grid.innerHTML = '';

            let filteredAnimes = animeList;
            if (currentFilter !== "All") filteredAnimes = filteredAnimes.filter(a => a.tags.some(t => t.trim() === currentFilter));
            if (searchQuery !== "") filteredAnimes = filteredAnimes.filter(a => a.name.toLowerCase().includes(searchQuery.toLowerCase()));

            if(filteredAnimes.length === 0) {
                grid.innerHTML = `<div class="empty-msg">No anime found. Data is loading or empty!</div>`;
                return;
            }

            filteredAnimes.forEach(anime => {
                let tagsHtml = anime.tags.map(tag => `<span class="card-tag">${tag.trim()}</span>`).join('');
                const card = document.createElement("div");
                card.className = "anime-card";
                card.innerHTML = `
                    <img src="${anime.img}" alt="${anime.name}" class="anime-img" onerror="this.src='https://via.placeholder.com/400x600/12151c/00ffcc?text=No+Image'">
                    <div class="card-overlay">
                        <div class="anime-title">${anime.name}</div>
                        <div class="anime-tags">${tagsHtml}</div>
                    </div>
                    <button class="delete-btn" onclick="deleteAnime('${anime.id}', event)" title="Delete Anime">✖</button>
                `;
                grid.appendChild(card);
            });
        }

        function handleSearch() {
            searchQuery = document.getElementById("search-input").value;
            renderGrid();
        }

        function checkAdmin() {
            if(isAdmin) {
                if(confirm("Logout from Admin mode?")) {
                    isAdmin = false; sessionStorage.removeItem("2x_admin");
                    document.body.classList.remove('admin-mode');
                    document.getElementById('lock-svg').innerHTML = '<path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/>';
                    document.getElementById('admin-icon').classList.remove('unlocked');
                }
                return;
            }

            const pass = prompt("Enter Vault Access Code:");
            if (pass === "7391737301") {
                enableAdminMode();
                alert("Access Granted! Welcome to the Admin Panel.");
            } else if (pass !== null) {
                alert("Access Denied! Intruder detected.");
            }
        }

        function enableAdminMode() {
            isAdmin = true; sessionStorage.setItem("2x_admin", "true");
            document.body.classList.add('admin-mode');
            document.getElementById('lock-svg').innerHTML = '<path d="M12 17c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm6-9h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6h1.9c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm0 12H6V10h12v10z"/>';
            document.getElementById('admin-icon').classList.add('unlocked');
        }

        function deleteAnime(id, event) {
            event.stopPropagation();
            if(confirm("Permanently delete this anime from global server?")) {
                db.ref('animes/' + id).remove();
            }
        }

        const modal = document.getElementById("admin-modal");
        function openModal() { modal.classList.add('show'); }
        function closeModal() {
            modal.classList.remove('show');
            setTimeout(() => {
                document.getElementById("anime-name").value = '';
                document.getElementById("anime-img").value = '';
                document.getElementById("anime-tags").value = '';
            }, 300);
        }

        function saveAnime() {
            const name = document.getElementById("anime-name").value.trim();
            const img = document.getElementById("anime-img").value.trim();
            const tagsInput = document.getElementById("anime-tags").value.trim();

            if (!name || !img || !tagsInput) { alert("Please fill all fields!"); return; }

            const tags = tagsInput.split(',').map(tag => tag.trim()).filter(tag => tag !== "");
            
            // Push to Firebase Realtime Database
            db.ref('animes').push({
                name: name,
                img: img,
                tags: tags
            });

            closeModal();
        }

        // --- MAGIC GLOW CURSOR ---
        const cursorGlow = document.getElementById('cursor-glow');
        document.addEventListener('mousemove', (e) => { cursorGlow.style.left = e.clientX + 'px'; cursorGlow.style.top = e.clientY + 'px'; });
        document.addEventListener('touchmove', (e) => { cursorGlow.style.left = e.touches[0].clientX + 'px'; cursorGlow.style.top = e.touches[0].clientY + 'px'; });
        document.addEventListener('touchstart', (e) => { cursorGlow.style.left = e.touches[0].clientX + 'px'; cursorGlow.style.top = e.touches[0].clientY + 'px'; cursorGlow.style.width = '500px'; cursorGlow.style.height = '500px'; });
        document.addEventListener('touchend', () => { cursorGlow.style.width = '400px'; cursorGlow.style.height = '400px'; });
        document.addEventListener('mousedown', () => { cursorGlow.style.width = '500px'; cursorGlow.style.height = '500px'; });
        document.addEventListener('mouseup', () => { cursorGlow.style.width = '400px'; cursorGlow.style.height = '400px'; });

        init();
    </script>
</body>
</html>
