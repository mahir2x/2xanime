<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2X Anime Vault - Fancy Optimized</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800;900&display=swap" rel="stylesheet">
    <style>
        /* --- GOD LEVEL CSS VARIABLES --- */
        :root {
            --theme: #00e5ff; 
            --theme-glow: rgba(0, 229, 255, 0.3); 
            --bg-dark: #050914;
            --font-main: 'Outfit', sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: var(--font-main); }
        
        /* NO LAG BACKGROUND */
        body { 
            background-color: var(--bg-dark); 
            color: #fff; min-height: 100vh; overflow-x: hidden; scroll-behavior: smooth; 
            background-image: 
                radial-gradient(circle at 15% 50%, var(--theme-glow), transparent 25%), 
                radial-gradient(circle at 85% 30%, var(--theme-glow), transparent 25%);
            background-size: 100vw 100vh;
            background-attachment: fixed;
            transition: background 0.8s ease;
        }
        
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg-dark); }
        ::-webkit-scrollbar-thumb { background: var(--theme); border-radius: 10px; }

        /* --- EPIC INTRO --- */
        #intro-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #03060f; z-index: 99999; display: flex; flex-direction: column; justify-content: center; align-items: center; transition: opacity 0.8s ease, visibility 0.8s; }
        .vault-logo-big { font-size: 70px; font-weight: 900; letter-spacing: 12px; color: transparent; -webkit-text-stroke: 1px var(--theme); position: relative; }
        .vault-logo-big::before { content: '2X VAULT'; position: absolute; left: 0; top: 0; width: 0%; height: 100%; color: var(--theme); overflow: hidden; animation: fillText 2s ease-in-out forwards; -webkit-text-stroke: 0px; text-shadow: 0 0 20px var(--theme-glow); }
        @keyframes fillText { 0% { width: 0%; } 100% { width: 100%; } }
        .loading-bar { width: 250px; height: 3px; background: rgba(255, 255, 255, 0.05); margin-top: 20px; border-radius: 10px; overflow: hidden; position: relative; }
        .loading-bar::after { content: ''; position: absolute; top: 0; left: 0; width: 0%; height: 100%; background: var(--theme); animation: load 2s ease forwards; box-shadow: 0 0 10px var(--theme); }
        @keyframes load { 0% { width: 0%; } 100% { width: 100%; } }
        .intro-hidden { opacity: 0; visibility: hidden; }

        /* --- BURST ANIMATION (ON CLICK) --- */
        .sparkle-particle { position: fixed; width: 5px; height: 5px; border-radius: 50%; pointer-events: none; z-index: 999999; animation: sparkAnim 0.5s ease-out forwards; }
        @keyframes sparkAnim { 0% { transform: translate(-50%, -50%) scale(1.5); opacity: 1; } 100% { transform: translate(calc(-50% + var(--tx)), calc(-50% + var(--ty))) scale(0); opacity: 0; } }

        /* --- LIGHTWEIGHT HEADER --- */
        header { padding: 18px 35px; display: flex; justify-content: space-between; align-items: center; background: rgba(5, 9, 20, 0.98); position: sticky; top: 0; z-index: 1000; border-bottom: 1px solid rgba(0, 229, 255, 0.1); transition: border-color 0.5s; box-shadow: 0 5px 20px rgba(0,0,0,0.5); }
        
        .logo-box { display: flex; flex-direction: column; }
        .logo { font-size: 28px; font-weight: 900; letter-spacing: 2px; line-height: 1; cursor: pointer; }
        .logo span { color: var(--theme); text-shadow: 0 0 15px var(--theme-glow); transition: 0.5s; }
        .rank { font-size: 11px; font-weight: 800; color: #64748b; letter-spacing: 2px; text-transform: uppercase; margin-top: 4px; }
        .rank span { color: var(--theme); transition: 0.5s; }

        .search-container { flex: 1; max-width: 500px; margin: 0 20px; position: relative; }
        .search-box { width: 100%; display: flex; align-items: center; background: #0f172a; border: 1px solid #1e293b; border-radius: 12px; padding: 10px 20px; transition: 0.3s; }
        .search-box:focus-within { border-color: var(--theme); box-shadow: 0 5px 15px var(--theme-glow); transform: translateY(-1px); }
        .search-box input { width: 100%; background: transparent; border: none; color: #fff; outline: none; font-size: 15px; font-weight: 600; }
        .search-box input::placeholder { color: #475569; font-weight: 400; }
        .search-box svg { width: 18px; fill: var(--theme); margin-right: 12px; transition: 0.5s; }

        .tools { display: flex; gap: 12px; align-items: center; }
        .tool-btn { width: 42px; height: 42px; border-radius: 10px; background: #0f172a; border: 1px solid #1e293b; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: 0.3s; }
        .tool-btn:hover { background: var(--theme-glow); border-color: var(--theme); transform: translateY(-3px); }
        .tool-btn svg { width: 20px; fill: #64748b; transition: 0.3s; }
        .tool-btn:hover svg { fill: #fff; }

        .total-counter { font-size: 13px; font-weight: 800; background: #0f172a; padding: 8px 16px; border-radius: 10px; border: 1px solid #1e293b; }
        .total-counter span { color: var(--theme); font-size: 15px; margin-left: 5px; transition: 0.5s; }

        /* --- FANCY GRID & HOVER ENGINE (NO BLUR!) --- */
        .grid-container { padding: 40px 35px 100px; display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 28px; z-index: 10; }

        .anime-card { 
            border-radius: 16px; overflow: hidden; position: relative; cursor: pointer; aspect-ratio: 2/3; 
            background: #0f172a; border: 1px solid #1e293b; 
            box-shadow: 0 8px 20px rgba(0,0,0,0.6); 
            /* Bouncy smooth transition */
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.4s ease, border-color 0.4s ease; 
        }

        /* FANCY HOVER: Scale up + Glow (No blurring peers) */
        .anime-card:hover { 
            transform: translateY(-12px) scale(1.06); 
            border-color: var(--theme); 
            box-shadow: 0 20px 40px rgba(0,0,0,0.9), 0 0 30px var(--theme-glow); 
            z-index: 20; 
        }
        
        /* HOLOGRAPHIC SHINE EFFECT */
        .anime-card::before { 
            content: ''; position: absolute; top: 0; left: -150%; width: 50%; height: 100%; 
            background: linear-gradient(to right, transparent, rgba(255, 255, 255, 0.3), transparent); 
            transform: skewX(-25deg); transition: 0.7s; z-index: 3; pointer-events: none; 
        }
        .anime-card:hover::before { left: 150%; transition: 0.7s ease-in-out; }

        /* Image scaling inside */
        .anime-img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.6s cubic-bezier(0.25, 1, 0.5, 1); }
        .anime-card:hover .anime-img { transform: scale(1.12); filter: contrast(1.1); }
        
        .card-overlay { position: absolute; bottom: 0; left: 0; width: 100%; padding: 40px 15px 15px; background: linear-gradient(to top, rgba(0,0,0,0.95) 0%, rgba(0,0,0,0.5) 60%, transparent 100%); display: flex; flex-direction: column; justify-content: flex-end; z-index: 2; transition: 0.3s; }
        .anime-card:hover .card-overlay { padding-bottom: 25px; background: linear-gradient(to top, rgba(0,0,0,1) 0%, rgba(0,0,0,0.7) 70%, transparent 100%); }
        
        .anime-title { font-size: 18px; font-weight: 900; color: #fff; margin-bottom: 8px; line-height: 1.2; text-shadow: 0 2px 10px rgba(0,0,0,1); transition: 0.3s; transform: translateY(5px); }
        .anime-card:hover .anime-title { color: var(--theme); transform: translateY(0); }
        
        .anime-tags { display: flex; flex-wrap: wrap; gap: 6px; transform: translateY(5px); transition: 0.3s; opacity: 0.9; }
        .anime-card:hover .anime-tags { transform: translateY(0); opacity: 1; }
        .card-tag { background: rgba(255,255,255,0.08); color: #fff; font-size: 10px; padding: 4px 10px; border-radius: 6px; text-transform: uppercase; font-weight: 800; transition: 0.3s; border: 1px solid transparent; }
        .anime-card:hover .card-tag { color: var(--theme); background: var(--theme-glow); border-color: var(--theme); }

        /* Admin Card Actions */
        .admin-actions { position: absolute; top: 12px; right: 12px; display: none; gap: 8px; z-index: 5; opacity: 0; transition: 0.3s; transform: translateY(-5px); }
        .admin-mode .admin-actions { display: flex; }
        .anime-card:hover .admin-actions { opacity: 1; transform: translateY(0); }
        
        .action-btn { width: 35px; height: 35px; border-radius: 8px; border: none; display: flex; justify-content: center; align-items: center; cursor: pointer; transition: 0.2s; color: #fff; font-size: 14px; background: rgba(0, 0, 0, 0.8); }
        .edit-btn:hover { background: #3b82f6; transform: scale(1.1); box-shadow: 0 5px 15px rgba(59, 130, 246, 0.5); }
        .delete-btn:hover { background: #ef4444; transform: scale(1.1); box-shadow: 0 5px 15px rgba(239, 68, 68, 0.5); }

        /* --- ADD BUTTON --- */
        #add-btn-wrapper { position: fixed; bottom: 30px; right: 30px; display: none; z-index: 1000; }
        .admin-mode #add-btn-wrapper { display: flex; }
        #add-btn { background: var(--theme); color: #000; width: 60px; height: 60px; border-radius: 18px; font-size: 30px; font-weight: bold; border: none; cursor: pointer; box-shadow: 0 8px 25px var(--theme-glow); transition: 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); display: flex; align-items: center; justify-content: center; }
        #add-btn:hover { transform: scale(1.15) rotate(90deg); }

        /* --- ADMIN MODALS (LOGIN & ENTRY) --- */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(2, 6, 15, 0.95); display: none; justify-content: center; align-items: center; z-index: 2000; opacity: 0; transition: 0.3s ease; }
        .modal-overlay.show { opacity: 1; display: flex; }
        
        .modal-box { background: #0b1121; padding: 40px; border-radius: 20px; width: 100%; max-width: 420px; border: 1px solid var(--theme-glow); box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8), 0 0 30px var(--theme-glow) inset; transform: scale(0.95) translateY(20px); transition: 0.4s cubic-bezier(0.2, 0.8, 0.2, 1); }
        .modal-overlay.show .modal-box { transform: scale(1) translateY(0); }
        
        .modal-box h2 { color: #fff; margin-bottom: 30px; text-align: center; font-weight: 900; font-size: 26px; letter-spacing: 2px; text-transform: uppercase; }
        .modal-box h2 span { color: var(--theme); transition: 0.5s; }
        
        .input-group { margin-bottom: 20px; }
        .input-group label { display: block; font-size: 12px; margin-bottom: 8px; color: #94a3b8; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; }
        .input-group input { width: 100%; padding: 15px 18px; background: #050914; border: 1px solid #1e293b; color: #fff; border-radius: 12px; outline: none; font-size: 15px; transition: 0.3s; }
        .input-group input:focus { border-color: var(--theme); background: rgba(0, 229, 255, 0.03); box-shadow: 0 0 15px var(--theme-glow); }
        
        .modal-actions { display: flex; gap: 15px; margin-top: 30px; }
        .modal-btn { flex: 1; padding: 15px; border: none; border-radius: 12px; font-weight: 900; font-size: 14px; cursor: pointer; transition: 0.3s; text-transform: uppercase; letter-spacing: 1px; }
        .save-btn { background: var(--theme); color: #000; box-shadow: 0 5px 20px var(--theme-glow); transition: 0.5s; }
        .save-btn:hover { transform: translateY(-3px); box-shadow: 0 10px 25px var(--theme-glow); filter: brightness(1.2); }
        .cancel-btn { background: #1e293b; color: #cbd5e1; }
        .cancel-btn:hover { background: #334155; color: #fff; transform: translateY(-3px); }

        .empty-msg { grid-column: 1/-1; text-align: center; color: #475569; padding: 80px 20px; font-size: 20px; font-weight: 800; text-transform: uppercase; letter-spacing: 2px; }

        /* --- MOBILE OPTIMIZATION --- */
        @media (max-width: 768px) {
            header { padding: 15px; flex-direction: column; gap: 12px; }
            .logo-box { flex-direction: row; justify-content: space-between; align-items: center; width: 100%; }
            .rank { margin-top: 0; }
            .search-container { margin: 0; max-width: 100%; width: 100%; }
            .tools { justify-content: space-between; width: 100%; }
            .total-counter { display: none; }
            
            .grid-container { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); padding: 20px 15px 80px; gap: 15px; }
            .anime-title { font-size: 15px; }
            .admin-actions { opacity: 1; display: flex; transform: none; } 
            
            #add-btn-wrapper { bottom: 20px; right: 20px; }
            .modal-box { padding: 30px 20px; }
            .vault-logo-big { font-size: 45px; }
        }
    </style>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>

    <!-- Cinematic Intro -->
    <div id="intro-screen">
        <div class="vault-logo-big">2X <span>VAULT</span></div>
        <div class="loading-bar"></div>
    </div>

    <!-- Header -->
    <header>
        <div class="logo-box">
            <div class="logo" onclick="window.scrollTo(0,0)">2X <span>Vault</span></div>
            <div class="rank">STATUS: <span id="user-rank">SYSTEM BOOT</span></div>
        </div>
        
        <div class="search-container">
            <div class="search-box">
                <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
                <input type="text" id="search-input" placeholder="Search by name or tags..." oninput="handleSearch()">
            </div>
        </div>

        <div class="tools">
            <div class="total-counter">VAULT: <span id="total-stats">0</span></div>
            
            <div class="tool-btn" onclick="switchTheme()" title="Change Aura">
                <svg viewBox="0 0 24 24"><path d="M12 3c-4.97 0-9 4.03-9 9s4.03 9 9 9c.83 0 1.5-.67 1.5-1.5 0-.39-.15-.74-.39-1.01-.23-.26-.38-.61-.38-.99 0-.83.67-1.5 1.5-1.5H16c2.76 0 5-2.24 5-5 0-4.42-4.03-8-9-8zm-5.5 9c-.83 0-1.5-.67-1.5-1.5S5.67 9 6.5 9 8 9.67 8 10.5 7.33 12 6.5 12zm3-4C8.67 8 8 7.33 8 6.5S8.67 5 9.5 5s1.5.67 1.5 1.5S10.33 8 9.5 8zm5 0c-.83 0-1.5-.67-1.5-1.5S13.67 5 14.5 5s1.5.67 1.5 1.5S15.33 8 14.5 8zm3 4c-.83 0-1.5-.67-1.5-1.5S16.67 9 17.5 9s1.5.67 1.5 1.5-.67 1.5-1.5 1.5z"/></svg>
            </div>

            <!-- Admin Lock Button -->
            <div class="tool-btn admin-lock" id="admin-icon" onclick="checkAdmin()" title="Admin Terminal">
                <svg id="lock-svg" viewBox="0 0 24 24"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/></svg>
            </div>
        </div>
    </header>

    <div class="grid-container" id="anime-grid"></div>

    <div id="add-btn-wrapper">
        <button id="add-btn" onclick="openModal()">+</button>
    </div>

    <!-- UPGRADED ADMIN LOGIN MODAL -->
    <div id="login-modal" class="modal-overlay">
        <div class="modal-box">
            <h2>SYSTEM <span>LOGIN</span></h2>
            <div class="input-group">
                <label>Admin Passcode</label>
                <input type="password" id="admin-pass" placeholder="Enter Security Code..." autocomplete="off">
            </div>
            <div class="modal-actions">
                <button class="modal-btn cancel-btn" onclick="closeLogin()">Cancel</button>
                <button class="modal-btn save-btn" onclick="verifyAdmin()">Authorize</button>
            </div>
        </div>
    </div>

    <!-- Data Entry Modal -->
    <div id="admin-modal" class="modal-overlay">
        <div class="modal-box">
            <h2 id="modal-title">NEW <span>ENTRY</span></h2>
            <div class="input-group">
                <label>Title Designation</label>
                <input type="text" id="anime-name" placeholder="e.g. Solo Leveling" autocomplete="off">
            </div>
            <div class="input-group">
                <label>Visual Asset (URL)</label>
                <input type="text" id="anime-img" placeholder="Paste high-res image link" autocomplete="off">
            </div>
            <div class="input-group">
                <label>Classifications (Comma separated)</label>
                <input type="text" id="anime-tags" placeholder="e.g. Action, Fantasy, Magic" autocomplete="off">
            </div>
            <div class="modal-actions">
                <button class="modal-btn cancel-btn" onclick="closeModal()">Abort</button>
                <button class="modal-btn save-btn" onclick="saveAnime()" id="save-btn-text">Execute</button>
            </div>
        </div>
    </div>

    <script>
        // --- BURST SPARKLE FUNCTION ---
        function createBurst(x, y) {
            const rootStyle = getComputedStyle(document.documentElement);
            const themeColor = rootStyle.getPropertyValue('--theme').trim() || '#00e5ff';
            
            for(let i=0; i<10; i++) {
                let spark = document.createElement('div');
                spark.className = 'sparkle-particle';
                document.body.appendChild(spark);
                
                spark.style.left = x + 'px';
                spark.style.top = y + 'px';
                spark.style.background = themeColor;
                spark.style.boxShadow = `0 0 10px ${themeColor}`;
                
                let angle = Math.random() * Math.PI * 2;
                let velocity = 30 + Math.random() * 60;
                spark.style.setProperty('--tx', `${Math.cos(angle) * velocity}px`);
                spark.style.setProperty('--ty', `${Math.sin(angle) * velocity}px`);
                
                setTimeout(() => spark.remove(), 500);
            }
        }

        // --- LIVE THEME SWITCHER ---
        const themes = [
            { hex: '#00e5ff', name: 'CYBER CYAN' },
            { hex: '#ff0033', name: 'CRIMSON BLOOD' },
            { hex: '#a855f7', name: 'AMETHYST DOMAIN' },
            { hex: '#fbbf24', name: 'ROYAL GOLD' }
        ];
        let currentThemeIdx = 0;
        
        function switchTheme() {
            currentThemeIdx = (currentThemeIdx + 1) % themes.length;
            const newColor = themes[currentThemeIdx].hex;
            
            document.documentElement.style.setProperty('--theme', newColor);
            
            // Generate rgba for glow
            let r = parseInt(newColor.slice(1, 3), 16), g = parseInt(newColor.slice(3, 5), 16), b = parseInt(newColor.slice(5, 7), 16);
            document.documentElement.style.setProperty('--theme-glow', `rgba(${r}, ${g}, ${b}, 0.3)`);
            
            const rankEl = document.getElementById('user-rank');
            let oldText = rankEl.innerText;
            rankEl.innerText = themes[currentThemeIdx].name;
            setTimeout(() => { updateRank(animeList.length); }, 1500); 
        }

        // --- INTRO LOADER ---
        setTimeout(() => { document.getElementById('intro-screen').classList.add('intro-hidden'); }, 2200);

        // --- EXACT FIREBASE CONFIG ---
        const firebaseConfig = {
            apiKey: "AIzaSyDGYwvbygKeQ5DrHR1luMfdzpbHytPgRdoo",
            authDomain: "anime-hub-4b305.firebaseapp.com",
            databaseURL: "https://anime-hub-4b305-default-rtdb.firebaseio.com",
            projectId: "anime-hub-4b305",
            storageBucket: "anime-hub-4b305.firebasestorage.app",
            messagingSenderId: "194191383047",
            appId: "1:194191383047:web:1b346bbfad7ea2188268a2",
            measurementId: "G-L8D5LL02SS"
        };

        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let animeList = [];
        let searchQuery = "";
        let isAdmin = sessionStorage.getItem("2x_admin") === "true";
        let editingId = null; 

        db.ref('animes').on('value', (snapshot) => {
            animeList = [];
            snapshot.forEach((childSnapshot) => {
                let data = childSnapshot.val();
                data.id = childSnapshot.key;
                animeList.push(data);
            });
            animeList.reverse(); 
            renderApp();
        });

        function init() { if(isAdmin) enableAdminMode(); }

        // 🔥 FUNNY WEEB RANK SYSTEM 🔥
        function updateRank(count) {
            const rankEl = document.getElementById('user-rank');
            if(count === 0) rankEl.innerText = "FILTHY NORMIE";
            else if(count < 10) rankEl.innerText = "TRAINEE WEEB";
            else if(count < 30) rankEl.innerText = "CLOSET OTAKU";
            else if(count < 60) rankEl.innerText = "BASEMENT DWELLER";
            else if(count < 100) rankEl.innerText = "GRASS TOUCH NOT";
            else rankEl.innerText = "ANIME GOD";
        }

        function renderApp() {
            renderGrid();
            document.getElementById("total-stats").innerText = animeList.length;
            updateRank(animeList.length);
        }

        function renderGrid() {
            const grid = document.getElementById("anime-grid");
            grid.innerHTML = '';

            let filteredAnimes = animeList;
            
            // Advanced Search
            if (searchQuery !== "") {
                const query = searchQuery.toLowerCase().trim();
                filteredAnimes = filteredAnimes.filter(a => {
                    const safeName = a.name ? a.name.toLowerCase() : "";
                    const safeTags = a.tags ? a.tags : [];
                    const matchName = safeName.includes(query);
                    const matchTag = safeTags.some(tag => tag.toLowerCase().includes(query));
                    return matchName || matchTag; 
                });
            }

            if(filteredAnimes.length === 0) {
                grid.innerHTML = `<div class="empty-msg">No anime found for "${searchQuery}"</div>`;
                return;
            }

            filteredAnimes.forEach((anime, index) => {
                let safeTags = anime.tags ? anime.tags : [];
                let tagsHtml = safeTags.map(tag => `<span class="card-tag">${tag.trim()}</span>`).join('');
                let stringTags = safeTags.join(", ").replace(/"/g, '&quot;'); 
                let safeName = anime.name.replace(/"/g, '&quot;');
                let safeImg = anime.img.replace(/"/g, '&quot;');

                const card = document.createElement("div");
                card.className = "anime-card";
                card.style.animationDelay = `${(index % 10) * 0.05}s`; 
                
                card.onclick = (e) => {
                    let clientX = e.clientX || (e.touches && e.touches[0].clientX);
                    let clientY = e.clientY || (e.touches && e.touches[0].clientY);
                    createBurst(clientX, clientY);
                };
                
                card.innerHTML = `
                    <img src="${anime.img}" alt="${safeName}" class="anime-img" onerror="this.src='https://via.placeholder.com/400x600/0f172a/00e5ff?text=No+Image'">
                    <div class="card-overlay">
                        <div class="anime-title">${anime.name}</div>
                        <div class="anime-tags">${tagsHtml}</div>
                    </div>
                    <div class="admin-actions">
                        <button class="action-btn edit-btn" onclick="editAnime('${anime.id}', '${safeName}', '${safeImg}', '${stringTags}', event)" title="Modify">✏️</button>
                        <button class="action-btn delete-btn" onclick="deleteAnime('${anime.id}', event)" title="Eradicate">✖</button>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function handleSearch() {
            searchQuery = document.getElementById("search-input").value;
            renderGrid();
        }

        // --- NEW ADMIN LOGIN LOGIC ---
        function checkAdmin() {
            if(isAdmin) {
                if(confirm("Terminate Admin Session?")) {
                    isAdmin = false; sessionStorage.removeItem("2x_admin");
                    document.body.classList.remove('admin-mode');
                    document.getElementById('lock-svg').innerHTML = '<path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/>';
                    document.getElementById('admin-icon').classList.remove('unlocked');
                }
            } else {
                document.getElementById('login-modal').classList.add('show');
                document.getElementById('admin-pass').value = '';
                setTimeout(() => { document.getElementById('admin-pass').focus(); }, 100);
            }
        }

        function closeLogin() {
            document.getElementById('login-modal').classList.remove('show');
        }

        function verifyAdmin() {
            const pass = document.getElementById('admin-pass').value;
            if (pass === "7391737301") {
                enableAdminMode(); 
                closeLogin();
                setTimeout(() => alert("ACCESS GRANTED: Welcome to the Vault."), 300);
            } else { 
                alert("ACCESS DENIED: Incorrect Passcode."); 
                document.getElementById('admin-pass').value = '';
                document.getElementById('admin-pass').focus();
            }
        }

        document.getElementById('admin-pass').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') verifyAdmin();
        });

        function enableAdminMode() {
            isAdmin = true; sessionStorage.setItem("2x_admin", "true");
            document.body.classList.add('admin-mode');
            document.getElementById('lock-svg').innerHTML = '<path d="M12 17c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm6-9h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6h1.9c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm0 12H6V10h12v10z"/>';
            document.getElementById('admin-icon').classList.add('unlocked');
        }

        function deleteAnime(id, event) {
            event.stopPropagation();
            if(confirm("Eradicate this record from the database?")) { db.ref('animes/' + id).remove(); }
        }

        function editAnime(id, name, img, tags, event) {
            event.stopPropagation(); editingId = id;
            document.getElementById("modal-title").innerHTML = "MODIFY <span>ENTRY</span>";
            document.getElementById("save-btn-text").innerText = "UPDATE RECORD";
            document.getElementById("anime-name").value = name;
            document.getElementById("anime-img").value = img;
            document.getElementById("anime-tags").value = tags;
            document.getElementById("admin-modal").classList.add('show');
        }

        function openModal() { 
            editingId = null;
            document.getElementById("modal-title").innerHTML = "NEW <span>ENTRY</span>";
            document.getElementById("save-btn-text").innerText = "EXECUTE";
            document.getElementById("admin-modal").classList.add('show'); 
        }

        function closeModal() {
            document.getElementById("admin-modal").classList.remove('show');
            setTimeout(() => {
                editingId = null; document.getElementById("anime-name").value = '';
                document.getElementById("anime-img").value = ''; document.getElementById("anime-tags").value = '';
            }, 300);
        }

        function saveAnime() {
            const name = document.getElementById("anime-name").value.trim();
            const img = document.getElementById("anime-img").value.trim();
            const tagsInput = document.getElementById("anime-tags").value.trim();
            if (!name || !img || !tagsInput) { alert("Missing parameters!"); return; }
            
            const tags = tagsInput.split(',').map(tag => tag.trim()).filter(tag => tag !== "");
            
            if(editingId) { db.ref('animes/' + editingId).update({ name: name, img: img, tags: tags });
            } else { db.ref('animes').push({ name: name, img: img, tags: tags }); }
            closeModal();
        }

        init();
    </script>
</body>
</html>
